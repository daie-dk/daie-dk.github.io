<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Palette preview | DAIE</title><link rel="stylesheet" href="assets/style.css"></head><body data-theme="burgundy"><div class="wrap"><h2 style="margin-top:35px">Explore the colour family</h2><p>This separate preview is not linked from the public site. Choose a palette to preview it below; the website files are unchanged.</p><div class="palettes"><button data-theme="orange">Dutch · orange / purple</button><button data-theme="burgundy">Danish · burgundy / coral</button><button data-theme="purple">Norwegian · purple / orange</button></div><p id="swatches"></p></div><iframe title="English homepage palette preview" src="en/index.html" style="width:100%;height:78vh;border:1px solid #ddd"></iframe><script>let theme='burgundy';const frame=document.querySelector('iframe');function apply(){document.body.dataset.theme=theme;try{frame.contentDocument.body.dataset.theme=theme}catch(e){}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelector('#swatches').textContent=theme==='orange'?'Primary #B64408 · Deep #873006 · Accent #5A23C9 · Calm #FFFFFF':theme==='burgundy'?'Primary #8B2545 · Deep #61172F · Accent #B9412C · Calm #FFFFFF':'Primary #5A23C9 · Deep #3D148A · Accent #B84708 · Calm #FFFFFF'}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;apply()});frame.addEventListener('load',apply);apply();</script></body></html>
